[package]
name = "memoria-gpui"
version = "0.7.2"
publish = false
edition = "2021"
description = "GPUI clone of the Memoria notes/diary UI (experimental, KOS-146)"
default-run = "memoria-gpui"

[workspace]
members = ["crates/*"]

[dependencies]
# gpui-kit pins the matching gpui-pre snapshot and puts GPUI at its root, so
# `use gpui::...` keeps working through this alias.
gpui = { package = "gpui-kit", version = "=0.6.2" }
gpui-component = "=0.6.2"
# Shared Mundus GPUI visual core (theme/palettes). Same pin as agenda-gpui
# and cortex/manager-gpui: one imago rev across all consumers (KOS-319).
imago-gpui = { git = "https://github.com/makekosmos/imago.git", rev = "f3e783705796a7a9d02e3baac4d2c6c8bd5c9929" }
# Shared Engine error classes (`engine_error`) — typed wire codes + Russian
# user text, owned by the kit so the apps don't keep three copies (KOS-298).
# Since KOS-319 the kit lives at crates/mundus-gpui-kit inside imago — pin
# the SAME imago rev as imago-gpui so the lockfile holds one source.
mundus-gpui-kit = { git = "https://github.com/makekosmos/imago.git", rev = "f3e783705796a7a9d02e3baac4d2c6c8bd5c9929" }
serde = { version = "1.0.229", features = ["derive"] }
# preserve_order: Vue parity depends on JSON.stringify key order — header
# props, extensions and fingerprinted content must keep insertion order.
serde_json = { version = "1.0.151", features = ["preserve_order"] }
uuid = { version = "1.26.1", features = ["v4", "v5"] }
ureq = { version = "2.12", default-features = false, features = ["json"] }
regex = "1.11"
# Local wall-clock for diary labels (JS `new Date()` getters are local time).
chrono = { version = "0.4.45", default-features = false, features = ["clock"] }
# `migrationObjectId` — SHA-256 of `${namespace}\0${sourceId}`.
sha2 = "0.10.9"
# Plain-text WS client for the Engine change stream (ws_port in
# engine.lock.json); loopback only, no TLS.
tungstenite = { version = "0.26", default-features = false, features = ["handshake"] }
memoria-editor-gpui = { version = "0.1.0", path = "crates/memoria-editor-gpui" }
unicode-normalization = "0.1.25"
percent-encoding = "2.3.2"
scraper = "0.24"
url = "2.5"

[dev-dependencies]
proptest = "1.5"
tempfile = "3.14"
# a11y-tree + UI autotests: #[gpui::test] + TestAppContext/VisualTestContext
# live behind gpui's test-support feature (deterministic executors, test
# platform, debug_bounds). It merges only into test builds.
gpui = { package = "gpui-kit", version = "=0.6.2", features = ["test-support"] }

# Dev builds: keep debug info but optimize — unoptimized taffy/cosmic-text/
# gpui (and our own render path) make even modest UIs run at ~20fps.
[profile.dev]
opt-level = 3

[profile.dev.package."*"]
opt-level = 3
debug-assertions = false
overflow-checks = false

[profile.release]
# debug-assertions MUST stay false: gpui-pre-windows compiles its HLSL
# shaders via fxc only when build scripts are built without debug
# assertions (see its build.rs); the debug path is a runtime compile that
# bakes a Linux cargo-registry path into the exe when cross-compiling.
debug = false
debug-assertions = false

# Ensure gpui's build.rs (not just the lib) sees debug_assertions=false so it
# runs fxc and emits shaders_bytes.rs. Cargo's default release build-override
# can leave assertions on for build scripts.
[profile.release.build-override]
debug-assertions = false
opt-level = 0

# Unconditional so build.rs can invoke embed_resource::compile unconditionally
# once its CARGO_CFG_TARGET_OS check passes (target-gated deps would also
# resolve for a Windows target, but the crate name would still need cfg-gated
# code paths in build.rs on non-Windows builds).
[build-dependencies]
embed-resource = "3.0"

