[advisories]
version = 2
# Transitive, unmaintained-only advisories pinned by gpui-kit 0.6.2 /
# gpui-pre 0.3.5. No safe upgrade exists in the current upstream line;
# re-evaluate when gpui-kit is bumped.
ignore = [
    "RUSTSEC-2024-0384", # instant
    "RUSTSEC-2024-0436", # paste
    "RUSTSEC-2025-0134", # rustls-pemfile
    "RUSTSEC-2026-0192", # ttf-parser
    "RUSTSEC-2026-0206", # rustybuzz
]

[licenses]
# memoria-gpui is a private app crate; publish = false.
private = { ignore = true }
# Allow the standard permissive set covering the gpui-kit/imago dep tree.
# GPL-2.0/LGPL-2.1 show up only as OR-alternatives alongside MIT/Apache-2.0
# and are satisfied by the permissive branch, so they are not listed.
allow = [
    "0BSD",
    "Apache-2.0",
    "Apache-2.0 WITH LLVM-exception",
    "BSD-2-Clause",
    "BSD-3-Clause",
    "BSL-1.0",
    "bzip2-1.0.6",
    "CC0-1.0",
    "ISC",
    "MIT",
    "MIT-0",
    "MPL-2.0",
    "Unicode-3.0",
    "Unlicense",
    "Zlib",
]

[bans]
multiple-versions = "warn"
wildcards = "allow"

[sources]
unknown-registry = "deny"
unknown-git = "deny"
# imago-gpui is consumed straight from the (public) imago repo by rev.
allow-git = ["https://github.com/makekosmos/imago.git"]
