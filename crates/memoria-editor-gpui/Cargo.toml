[package]
name = "memoria-editor-gpui"
version = "0.1.0"
publish = false
edition = "2021"
description = "GPUI note editor on memoria-editor-core: Live Preview render, IME, tree-sitter code highlight, images (KOS-150, M3)"

[dependencies]
memoria-editor-core = { path = "../memoria-editor-core" }
gpui = { package = "gpui-kit", version = "=0.6.2" }
# gpui-component tree-sitter feature set covering the Vue SHIKI_LANGUAGES
# table that has a grammar in the upstream feature list. The remaining six
# (ini/less/objc/perl/r/xml) come from direct grammar crates below and are
# registered into `gpui_component::highlighter::LanguageRegistry`.
gpui-component = { version = "=0.6.2", features = [
    "tree-sitter",
    "tree-sitter-bash",
    "tree-sitter-c",
    "tree-sitter-cpp",
    "tree-sitter-csharp",
    "tree-sitter-css",
    "tree-sitter-diff",
    "tree-sitter-go",
    "tree-sitter-graphql",
    "tree-sitter-html",
    "tree-sitter-java",
    "tree-sitter-javascript",
    "tree-sitter-kotlin",
    "tree-sitter-lua",
    "tree-sitter-make",
    "tree-sitter-markdown",
    "tree-sitter-php",
    "tree-sitter-python",
    "tree-sitter-ruby",
    "tree-sitter-rust",
    "tree-sitter-sql",
    "tree-sitter-swift",
    "tree-sitter-typescript",
    "tree-sitter-yaml",
] }
imago-gpui = { git = "https://github.com/makekosmos/imago.git", rev = "f3e783705796a7a9d02e3baac4d2c6c8bd5c9929" }
# ropey pinned to the exact version gpui-component's highlighter uses —
# `SyntaxHighlighter::update` takes `&ropey::Rope` from this release line.
ropey = "=2.0.0-beta.1"
unicode-segmentation = "1.13"
# Tree-sitter grammars for SHIKI languages absent from gpui-component's
# feature list. All LanguageFn-based, ABI-compatible with tree-sitter 0.26.
tree-sitter-ini = "1.4"
tree-sitter-less = "1.0"
tree-sitter-objc = "3.0"
tree-sitter-perl = "1.1"
tree-sitter-r = "1.3"
tree-sitter-xml = "0.7"
tree-sitter = "0.26.13"

[dev-dependencies]
# Headless-window test harness (VisualTestContext, #[gpui::test]).
gpui = { package = "gpui-kit", version = "=0.6.2", features = ["test-support"] }

[lints]
workspace = true
